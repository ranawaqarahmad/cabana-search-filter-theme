<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Results</title>

    <style>
      body {
        font-family: Arial, sans-serif;
      }

      .search-container {
        position: relative;
        width: 300px;
        margin: 50px auto;
      }

      .search-input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .popup {
        position: absolute;
        top: 100%;
        left: 0;
        width: 800px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 5px;
        display: none;
        max-height: 250px;
        overflow-y: auto;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 1000;
        padding: 10px;
      }

      /* Grid layout for two-column results */
      .popup-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .search-item {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid #efefef;
        padding: 10px;
        border-radius: 5px;
        text-decoration: none;
        color: black;
        transition: background 0.2s;
      }

      .search-item:hover {
        background: #f9f9f9;
      }

      .search-item img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 5px;
      }

      .item-details {
        display: flex;
        flex-direction: column;
      }

      .item-title {
        font-size: 14px;
        font-weight: bold;
        margin: 0;
      }

      .cabana-pricing-div {
        display: flex;
        gap: 5px;
        margin-top: 5px;
      }

      .price-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 4px;
      }

      .price-title {
        font-size: 12px;
        font-weight: bold;
        padding: 2px 5px;
        border-radius: 4px;
        margin-bottom: 2px;
      }

      .retail-title {
        background-color: #f8f9fa;
        color: #000;
      }

      .member-title {
        background-color: red;
        color: white;
      }

      .elite-title {
        background-color: gold;
        color: navy;
      }

      .price {
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 4px;
      }

      .retail-price {
        background-color: #f8f9fa;
        color: #000;
      }

      .member-price {
        background-color: red;
        color: white;
      }

      .elite-price {
        background-color: gold;
        color: navy;
      }
    </style>
  </head>
  <body>
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search..."
        onkeyup="showPopup()"
      />
      <div class="popup" id="searchPopup"></div>
    </div>

    <script>
      const baseUrl = "http://localhost:5000/api";

      function debounce(func, delay) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), delay);
        };
      }

      const showPopup = debounce(async function () {
        let inputValue = document
          .getElementById("searchInput")
          .value.toLowerCase();
        let popup = document.getElementById("searchPopup");

        if (inputValue.length === 0) {
          popup.style.display = "none";
          return;
        }

        try {
          const storeId = 4897;

          const resp = await fetch(
            `${baseUrl}/product/search?title=${inputValue}&storeId=${storeId}&limit=15&page=1`,
            {
              headers: { "Content-type": "application/json" },
            }
          );

          const { data } = await resp.json();

          if (data.length === 0) {
            popup.innerHTML = "<div>No results found</div>";
          } else {
            popup.innerHTML = `
              <div class="popup-container">
                ${data
                  .map((item) => {
                    if (!item.variants || !item.variants.length) return "";

                    let pricing = item.variants[0]?.pricing || {};
                    let pricingHTML = "";

                    if (pricing.retail_price) {
                      pricingHTML += `<div class="price-container">
                          <span class="price-title retail-title">Market</span>
                          <span class="price retail-price">$${pricing.retail_price.toFixed(
                            2
                          )}</span>
                        </div>`;
                    }
                    if (pricing.member_price > 0) {
                      pricingHTML += `<div class="price-container">
                          <span class="price-title member-title">Member</span>
                          <span class="price member-price">$${pricing.member_price.toFixed(
                            2
                          )}</span>
                        </div>`;
                    }
                    if (pricing.elite_price > 0) {
                      pricingHTML += `<div class="price-container">
                          <span class="price-title elite-title">Elite</span>
                          <span class="price elite-price">$${pricing.elite_price.toFixed(
                            2
                          )}</span>
                        </div>`;
                    }

                    return `<a class="search-item" href="/products/${
                      item.handle
                    }">
                      <img src="${item.images[0] || "/placeholder.jpg"}" alt="${
                      item.title.split(" ")[0]
                    }" />
                      <div class="item-details">
                        <h4 class="item-title">${item.title}</h4>
                        <div class="cabana-pricing-div">${pricingHTML}</div>
                      </div>
                    </a>`;
                  })
                  .join("")}
              </div>`;
          }
        } catch (error) {
          console.error("Error fetching search results:", error);
        }

        popup.style.display = "block";
      }, 300);

      document.addEventListener("click", function (event) {
        let popup = document.getElementById("searchPopup");
        let input = document.getElementById("searchInput");
        if (!input.contains(event.target) && !popup.contains(event.target)) {
          popup.style.display = "none";
        }
      });
    </script>
  </body>
</html>
